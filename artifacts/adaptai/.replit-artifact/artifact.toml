kind = "web"
previewPath = "/"
title = "AdaptAI"
description = "Uma plataforma de estudo que transforma documentação técnica em materiais personalizados: tutoriais, flashcards, quizzes, resumos e roteiros de aula, com progresso gamificado e conteúdo ligado à fonte original."
version = "1.0.0"
id = "artifacts/adaptai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20000

[services.development]
run = "pnpm --filter @workspace/adaptai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adaptai", "run", "build" ]
serve = "static"
publicDir = "artifacts/adaptai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20000"
BASE_PATH = "/"
